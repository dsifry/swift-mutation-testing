name: Release artifact contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Provision Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Test release artifact contract
        run: find Tests/ReleaseArtifact -maxdepth 1 -name '*.test.mjs' ! -name '*.integration.test.mjs' -print0 | xargs -0 node --test
