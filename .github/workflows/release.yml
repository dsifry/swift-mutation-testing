name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical release version (X.Y.Z)
        required: true
        type: string
      canonical_tag:
        description: Existing signed annotated canonical tag
        required: true
        type: string
      candidate_run_id:
        description: Candidate workflow run ID
        required: true
        type: number
      candidate_run_attempt:
        description: Candidate workflow run attempt
        required: true
        type: number
      candidate_artifact_id:
        description: Immutable candidate artifact ID
        required: true
        type: number
      candidate_artifact_name:
        description: Immutable candidate artifact name
        required: true
        type: string
      candidate_workflow_commit:
        description: Candidate workflow control commit SHA
        required: true
        type: string
      source_commit:
        description: Candidate source commit SHA
        required: true
        type: string
      manifest_sha256:
        description: Candidate manifest SHA-256
        required: true
        type: string
      archive_sha256:
        description: Candidate archive SHA-256
        required: true
        type: string
      executable_sha256:
        description: Candidate executable SHA-256
        required: true
        type: string
      candidate_descriptor_sha256:
        description: Accepted Guide candidate descriptor SHA-256
        required: true
        type: string
      proof_commit:
        description: Promotion control commit containing the reviewed proof
        required: true
        type: string
      guide_commit:
        description: Guide proof source commit SHA
        required: true
        type: string
      guide_proof_sha256:
        description: Reviewed Guide release proof SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: write
  attestations: read

concurrency:
  group: release-${{ inputs.canonical_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: macos-26
    environment: release-production
    steps:
      - name: Validate canonical promotion inputs
        env:
          VERSION: ${{ inputs.version }}
          CANONICAL_TAG: ${{ inputs.canonical_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_WORKFLOW_COMMIT: ${{ inputs.candidate_workflow_commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PROOF_COMMIT: ${{ inputs.proof_commit }}
          GUIDE_COMMIT: ${{ inputs.guide_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          EXECUTABLE_SHA256: ${{ inputs.executable_sha256 }}
          CANDIDATE_DESCRIPTOR_SHA256: ${{ inputs.candidate_descriptor_sha256 }}
          GUIDE_PROOF_SHA256: ${{ inputs.guide_proof_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dsifry/swift-mutation-testing"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$CANONICAL_TAG" = "v$VERSION"
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$CANDIDATE_ARTIFACT_NAME" = "swift-mutation-testing-v${VERSION}-candidate-${CANDIDATE_RUN_ID}-${CANDIDATE_RUN_ATTEMPT}"
          for commit in "$CANDIDATE_WORKFLOW_COMMIT" "$SOURCE_COMMIT" "$PROOF_COMMIT" "$GUIDE_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          done
          for digest in "$MANIFEST_SHA256" "$ARCHIVE_SHA256" "$EXECUTABLE_SHA256" "$CANDIDATE_DESCRIPTOR_SHA256" "$GUIDE_PROOF_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done

      - name: Preflight protected repository controls
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_WORKFLOW_COMMIT: ${{ inputs.candidate_workflow_commit }}
        run: |
          set -euo pipefail
          RUN_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '[.path,.head_branch,.head_sha,.event,.status,.conclusion,(.run_attempt|tostring)]|join("|")')"
          test "$RUN_STATE" = ".github/workflows/release-candidate.yml|main|$CANDIDATE_WORKFLOW_COMMIT|workflow_dispatch|completed|success|$CANDIDATE_RUN_ATTEMPT"
          ARTIFACT_STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" --jq '[.name,(.workflow_run.id|tostring),(.expired|tostring),(.deleted_at == null|tostring)]|join("|")')"
          test "$ARTIFACT_STATE" = "$CANDIDATE_ARTIFACT_NAME|$CANDIDATE_RUN_ID|false|true"
          gh api "repos/$GITHUB_REPOSITORY/environments/release-production" --jq -e '.name == "release-production" and any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) == 1 and .prevent_self_review == true)' >/dev/null
          RULESET_IDS="$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '[.[] | select(.name == "immutable-release-tags" and .enforcement == "active") | .id] | if length == 1 then .[0] else error("exactly one active immutable-release-tags ruleset is required") end')"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_IDS" --jq -e '.target == "tag" and (.bypass_actors | length) == 0 and (.conditions.ref_name.include == ["refs/tags/v*"]) and any(.rules[]; .type == "update") and any(.rules[]; .type == "deletion")' >/dev/null

      - name: Checkout proof-bearing control tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.proof_commit }}
          path: ${{ github.workspace }}/control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable candidate control tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.candidate_workflow_commit }}
          path: ${{ github.workspace }}/candidate-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate source tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_commit }}
          path: ${{ github.workspace }}/source
          fetch-depth: 1
          persist-credentials: false

      - name: Provision checksum-pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify proof checkout and bytes
        env:
          PROOF_COMMIT: ${{ inputs.proof_commit }}
          CANDIDATE_WORKFLOW_COMMIT: ${{ inputs.candidate_workflow_commit }}
          GUIDE_PROOF_SHA256: ${{ inputs.guide_proof_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C "${{ github.workspace }}/control" rev-parse HEAD)" = "$PROOF_COMMIT"
          test "$(git -C "${{ github.workspace }}/candidate-control" rev-parse HEAD)" = "$CANDIDATE_WORKFLOW_COMMIT"
          OBSERVED_PROOF_SHA256="$(shasum -a 256 "${{ github.workspace }}/control/Docs/ReleaseEvidence/v1.3.1-guide-proof.json" | awk '{print $1}')"
          test "$OBSERVED_PROOF_SHA256" = "$GUIDE_PROOF_SHA256"

      - name: Promote exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_WORKFLOW_COMMIT: ${{ inputs.candidate_workflow_commit }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          EXECUTABLE_SHA256: ${{ inputs.executable_sha256 }}
          CANDIDATE_DESCRIPTOR_SHA256: ${{ inputs.candidate_descriptor_sha256 }}
          PROOF_COMMIT: ${{ inputs.proof_commit }}
          GUIDE_COMMIT: ${{ inputs.guide_commit }}
          GUIDE_PROOF_SHA256: ${{ inputs.guide_proof_sha256 }}
        run: |
          set -euo pipefail
          node "${{ github.workspace }}/control/scripts/promote-release-candidate.mjs" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --candidate-workflow-commit "$CANDIDATE_WORKFLOW_COMMIT" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --executable-sha256 "$EXECUTABLE_SHA256" \
            --candidate-descriptor-sha256 "$CANDIDATE_DESCRIPTOR_SHA256" \
            --control-commit "$PROOF_COMMIT" \
            --guide-commit "$GUIDE_COMMIT" \
            --guide-proof-sha256 "$GUIDE_PROOF_SHA256" \
            --control-root "${{ github.workspace }}/control" \
            --candidate-control-root "${{ github.workspace }}/candidate-control" \
            --source-root "${{ github.workspace }}/source" \
            --work-root "${{ runner.temp }}/release-promotion"
